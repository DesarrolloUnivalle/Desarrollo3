name: Deploy Usuarios Service

on:
  push:
    branches:
      - develop
      - test-workflow
    paths:
      - 'sistema-gestion-ordenes/backend/usuarios-service/**'
  pull_request:
    branches: 
      - develop
      - main
      - test-workflow

env:
  SERVICE_NAME: usuarios-service
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/usuarios-service
  K8S_DIR: sistema-gestion-ordenes/backend/usuarios-service/kubernetes
  MINIKUBE_VERSION: latest
  KUBECTL_VERSION: stable

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Minikube and dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl conntrack
          curl -LO https://storage.googleapis.com/minikube/releases/${{ env.MINIKUBE_VERSION }}/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          minikube version
          # Instalar kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/${{ env.KUBECTL_VERSION }}.txt)/bin/linux/amd64/kubectl"
          sudo install kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Start Minikube cluster
        run: |
          minikube start --driver=docker --cpus=2 --memory=4096
          minikube addons enable ingress
          minikube addons enable metrics-server
          minikube addons enable dashboard
          minikube addons enable storage-provisioner

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build and test
        run: |
          mvn clean package -f sistema-gestion-ordenes/backend/${{ env.SERVICE_NAME }}/pom.xml
          mvn test -f sistema-gestion-ordenes/backend/${{ env.SERVICE_NAME }}/pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest sistema-gestion-ordenes/backend/${{ env.SERVICE_NAME }}
          docker push ${{ env.DOCKER_IMAGE }}:latest
          # Cargar en el entorno de Docker de Minikube
          eval $(minikube -p minikube docker-env)
          docker build -t ${{ env.DOCKER_IMAGE }}:latest sistema-gestion-ordenes/backend/${{ env.SERVICE_NAME }}

      - name: Set up envsubst
        run: sudo apt-get install -y gettext-base

      - name: Process Kubernetes templates
        run: |
          cd ${{ env.K8S_DIR }}
          export SERVICE_NAME=${{ env.SERVICE_NAME }}
          export DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}
          export JAVA_OPTS="-Xms512m -Xmx1024m"
          envsubst < deployment.tpl > deployment.yml
          envsubst < service.yml > service-processed.yml
          envsubst < hpa.yml > hpa-processed.yml

      - name: Deploy to Minikube
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/deployment.yml
          kubectl apply -f ${{ env.K8S_DIR }}/service-processed.yml
          kubectl apply -f ${{ env.K8S_DIR }}/hpa-processed.yml
          kubectl rollout status deployment/${{ env.SERVICE_NAME }}-deployment --timeout=90s

      - name: Configure monitoring
        run: |
          # Instalar Prometheus y Grafana
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install prometheus prometheus-community/kube-prometheus-stack

      - name: Smoke test
        run: |
          # Esperar a que el servicio esté listo
          sleep 15
          # Obtener URL del servicio
          SERVICE_URL=$(minikube service ${{ env.SERVICE_NAME }}-service --url)
          # Verificar health endpoint
          curl -sSf $SERVICE_URL/actuator/health
          # Verificar prometheus endpoint
          curl -sSf $SERVICE_URL/actuator/prometheus | head -n 5
          # Verificar métricas básicas
          curl -sSf $SERVICE_URL/actuator/metrics | grep -E "jvm|system"

      - name: Performance test
        run: |
          # Instalar hey para pruebas de carga
          go install github.com/rakyll/hey@latest
          SERVICE_URL=$(minikube service ${{ env.SERVICE_NAME }}-service --url)
          hey -n 100 -c 10 $SERVICE_URL/actuator/health

      - name: Cleanup
        if: always()
        run: |
          minikube stop
          minikube delete