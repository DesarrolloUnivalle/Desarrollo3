server:
  port: 8080  # Puerto del microservicio

spring:
  application:
    name: ordenes-service
  
  datasource:
    url: jdbc:postgresql://ep-withered-king-aa21vv8q-pooler.westus3.azure.neon.tech:5432/neondb?user=neondb_owner&password=npg_0gnbkuv5IWlH&sslmode=require
    username: neondb_owner
    password: npg_0gnbkuv5IWlH
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092  # Broker de Kafka
    consumer:
      group-id: ordenes-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/auth/realms/tienda
          jwk-set-uri: http://localhost:8081/auth/realms/tienda/protocol/openid-connect/certs

# Configuración JWT (debe coincidir con usuarios-service)
jwt:
  secret: "+7xPjMy3ShEYQClRLDpvwcy6GjDADONvh10c4iMxFrU="  # Mismo secret que usuarios-service
  expiration: 3600000  # 1 hora en ms

# URLs de otros microservicios
productos-service:
  url: http://localhost:8081  # URL de productos-service

usuarios-service:
  url: http://localhost:8082  # URL de usuarios-service (para futuras integraciones)

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always